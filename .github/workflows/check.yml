name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: for t in tests/test_*.cjs; do node "$t" || exit 1; done
      - run: npm run build
        env:
          PAGES_BASE: /johamin/
